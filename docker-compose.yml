services:
  api:
    build: { context: ./backend, dockerfile: Dockerfile }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: backend/.env
    volumes: ["./data:/app/data_store"]
    ports: ["8000:8000"]
  bot:
    build: { context: ./backend, dockerfile: Dockerfile }
    command: python -m bot.bot
    env_file: backend/.env
    volumes: ["./data:/app/data_store"]
